<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Atlas Trace">
  <!-- Fond plein (icône maskable : plein cadre, les plateformes arrondissent) -->
  <rect width="512" height="512" fill="#0F5044"/>
  <!-- Bouclier : contrôle d'accès -->
  <path d="M256 132 L372 172 L372 292 Q372 356 256 402 Q140 356 140 292 L140 172 Z"
        fill="#0A2E28" stroke="#FAF6EC" stroke-width="10" stroke-linejoin="round"/>
  <!-- Trace : chaîne de traçabilité (or) -->
  <polyline points="186,238 236,290 300,214 336,300"
            fill="none" stroke="#F2C14E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F2C14E">
    <circle cx="186" cy="238" r="15"/>
    <circle cx="236" cy="290" r="15"/>
    <circle cx="300" cy="214" r="15"/>
    <circle cx="336" cy="300" r="15"/>
  </g>
  <!-- Ligne de scan (crème) -->
  <rect x="176" y="336" width="160" height="9" rx="4.5" fill="#FAF6EC" opacity="0.85"/>
</svg>
